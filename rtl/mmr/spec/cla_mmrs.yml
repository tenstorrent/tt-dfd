c_dbg_cla_ctrl_status:
  common_data:
    VISIBILITY: Internal
    TYPE: CLA
    SUB_CATEGORY: ''
    ADDRESS: '0x000190'
    DESCRIPTION: Ctrl/Status register to Enable EAP after EAP programming is complete,
      and read the current node.
    MASKED_BY: c_dbg_cla_ctrl_status
    RESET_PORT: reset_n_warm_ovrride
    HW_READ: CLA
    SW_TYPE: WARL
  cla_lock:
    FIELDS_WIDTH: '1'
    FIELDS_RANGE: 63:63
    RESET_VALUE: '0'
    LEGAL_VALUE: ''
    DESCRIPTION: If this bit is set, then CLA is locked and the enbale_cla is latched
      forever
    MASKED_BY: ~cla_lock
    MASK_WRITES_ONLY?: 'True'
    RESET_PORT: ''
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  rsvd_62_16:
    FIELDS_WIDTH: '47'
    FIELDS_RANGE: '62:16'
    RESET_VALUE: '0'
    LEGAL_VALUE: ''
    DESCRIPTION: reserved fields
    RESET_PORT: ''
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  disable_local_clock_halt:
    FIELDS_WIDTH: '1'
    FIELDS_RANGE: '15:15'
    RESET_VALUE: '0'
    LEGAL_VALUE: ''
    DESCRIPTION: If this bit is set, clock halt action is not applied to local clocks
    RESET_PORT: ''
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  disable_global_clock_halt:
    FIELDS_WIDTH: '1'
    FIELDS_RANGE: '14:14'
    RESET_VALUE: '0'
    LEGAL_VALUE: ''
    DESCRIPTION: If this bit is set, clock halt action is not applied to global clocks
    RESET_PORT: ''
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  cla_chain_loop_delay:
    FIELDS_WIDTH: '7'
    FIELDS_RANGE: '13:7'
    RESET_VALUE: '36'
    LEGAL_VALUE: ''
    DESCRIPTION: "Creates a window in which we don\u2019t forward the incoming Xtrigger\
      \ and Clock_Halt signal"
    RESET_PORT: ''
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  enable_cla:
    FIELDS_WIDTH: '1'
    FIELDS_RANGE: '6:6'
    RESET_VALUE: '0'
    LEGAL_VALUE: ''
    DESCRIPTION: Set this bit to 1 to enable CLA. If this bit is set, CLA is clock
      gated (save pwr)
    MASKED_BY: ~cla_lock
    MASK_WRITES_ONLY?: 'True'
    RESET_PORT: ''
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  enable_eap:
    FIELDS_WIDTH: '1'
    FIELDS_RANGE: '5:5'
    RESET_VALUE: '0'
    LEGAL_VALUE: ''
    DESCRIPTION: Set Enable EAP to 1 after EAP programming is complete
    RESET_PORT: ''
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  current_node:
    FIELDS_WIDTH: '2'
