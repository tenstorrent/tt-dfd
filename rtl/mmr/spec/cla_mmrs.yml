c_dbg_cla_time_match:
  common_data:
    VISIBILITY: Internal
    TYPE: CLA
    SUB_CATEGORY: ''
    ADDRESS: '0x000220'
    DESCRIPTION: This value is compared (greater than or equal to the programmed value)
      against the internal time register value of the core, and is used to generate
      a time match event for CLA. Needs to be non zero for the time match event signal
      to trigger. The event will only trigger an action if the EAP programming is
      done. Requires writing 0 to this register to stop the match event.
    RESET_PORT: reset_n_warm_ovrride
    HW_READ: CLA
    SW_TYPE: WARL
  time_match_val:
    FIELDS_WIDTH: '64'
    FIELDS_RANGE: '63:0'
