c_dbg_ntrace_frame_cfg:
  common_data:
    VISIBILITY: Internal
    TYPE: Trace
    SUB_CATEGORY: ''
    ADDRESS: '0x0001A8'
    NTR_MMR_SIZE: '32'
    DESCRIPTION: ''
    RESET_PORT: ''
    HW_READ: NTR
    SW_TYPE: WARL
  frame_closure_mode:
    FIELDS_WIDTH: '1'
    FIELDS_RANGE: '21:21'
    RESET_VALUE: '0'
    LEGAL_VALUE: ''
    DESCRIPTION: 'Closure Mode: 1: Close frame with a packet no larger than max packet
      size  before any overflow (due to packets crossing frame boundary). 0: Close
      frame when packets cross boundary. Push back packet crossing frame boundary
      to packet generator.'
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  frame_mode_enable:
    FIELDS_WIDTH: '1'
    FIELDS_RANGE: '20:20'
    RESET_VALUE: '1'
    LEGAL_VALUE: ''
    DESCRIPTION: 'Enable Frame Mode (Frame Mode: Always pack "frame length" number
      of bytes for trace transmission). If flush to memory is stalled (due to silicon
      bug), we can have incomplete packets in memory. Frame Mode will help SW decoder
      to avoid reading incomplete trasnmitted packets. In Frame Mode, SW will get
      a memory pointer that is aligned to Frame Length. HW will ensure  there are
      no incomplete packets incluced in the region pointed by memory pointer.'
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  frame_lenght_in_bytes:
    FIELDS_WIDTH: '4'
    FIELDS_RANGE: '15:12'
    RESET_VALUE: '2'
    LEGAL_VALUE: ''
    DESCRIPTION: 'Use trDstTe[trDstVendorFrameLength] for Frame Length programming.
      Register field ZBB-ed. '
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  trace_frame_fill_byte:
    FIELDS_WIDTH: '8'
    FIELDS_RANGE: '11:4'
    RESET_VALUE: ff
    LEGAL_VALUE: ''
    DESCRIPTION: 'Use "Filler Packet" to align a stream of trace packets within a
      frame boundary. '
    SW_WRITE: W
    SW_READ: R
    SW_TYPE: ''
  trace_source_id:
