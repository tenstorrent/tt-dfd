#     FIELDS_WIDTH: '62'
#     FIELDS_RANGE: '63:2'
#     RESET_VALUE: '0'
#     LEGAL_VALUE: '[0:1]'
#     DESCRIPTION: Custom Core register - Reserved
#     SW_TYPE: ''
#   example1:
#     FIELDS_WIDTH: '1'
#     FIELDS_RANGE: '1:1'
#     RESET_VALUE: '0'
#     LEGAL_VALUE: ''
#     DESCRIPTION: Custom Core register - Example1
#     SW_TYPE: ''
#   example0:
#     FIELDS_WIDTH: '1'
#     FIELDS_RANGE: 0:0
#     RESET_VALUE: '0'
#     LEGAL_VALUE: ''
#     DESCRIPTION: Custom Core register - Example0
#     SW_TYPE: ''
