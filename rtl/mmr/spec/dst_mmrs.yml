#     SUB_CATEGORY: SdExt
#     ADDRESS: BC0
#     DESCRIPTION: Custom Core register
#     RESET_PORT: ''
#     HW_READ: SC,AP,MB,PM
#     HW_WRITE: SC,AP,MB,PM
#     SW_WRITE: W
#     SW_READ: R
#     SW_TYPE: WARL
